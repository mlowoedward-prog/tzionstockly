name: tzion_stockly
description: "Offline-first inventory management and analysis app for small shops in Tanzania."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  mobile_scanner: ^5.1.1
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  csv: ^8.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: 6.1.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^17.2.4
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
